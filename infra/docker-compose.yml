version: "3.9"
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: anomaly
    ports: ["5432:5432"]
    volumes: ["tsdb_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  tsdb_data:
