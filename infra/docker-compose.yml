services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: anomaly
    ports: ["5432:5432"]
    volumes: ["tsdb_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anomaly"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_ALLOW_AUTO_CREATE_TOPICS: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/kafka-init.sh"]
    volumes:
      - ./kafka-init.sh:/kafka-init.sh:ro

  fake-service:
    build:
      context: ../
      dockerfile: services/fake-service/Dockerfile
    env_file: env/fake-service.env
    ports: ["8090:8090"]
    restart: unless-stopped

  ingestion:
    build:
      context: ../
      dockerfile: services/ingestion/Dockerfile
    env_file: env/ingestion.env
    environment:
      ENABLE_BROKER: "true"
      BROKER_BROKERS: "kafka:9092"
      BROKER_TOPIC: metrics
      BROKER_GROUP_ID: ingestion-group
    ports: ["8080:8080"]
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  training:
    build:
      context: ..
      dockerfile: services/training/Dockerfile
    env_file: env/training.env
    environment:
      SERVICE_MODE: "api"
      DB_DSN: "postgres://postgres:secret@timescaledb:5432/anomaly?sslmode=disable"
    ports: ["8085:8085"]
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8085/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  analyzer:
    build:
      context: ../
      dockerfile: services/analyzer/Dockerfile
    env_file: env/analyzer.env
    environment:
      ML_SERVICE_URL: "http://training:8085"
    ports: ["8081:8081"]
    depends_on:
      timescaledb:
        condition: service_healthy
      training:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  notifier:
    build:
      context: ../
      dockerfile: services/notifier/Dockerfile
    env_file: env/notifier.env
    ports: ["8082:8082"]
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  agent:
    build:
      context: ../
      dockerfile: services/agent/Dockerfile
    env_file: env/agent.env
    depends_on:
      fake-service:
        condition: service_started
      ingestion:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tsdb_data: