# Model registry configuration for ML-based anomaly detection.
# Each entry maps (agent_id, metric) to an ONNX model stored in MinIO.

model_refresh_interval_sec: 300

mappings:
  - agent_id: "agent-test"
    metric: "test.signal"
    model_type: "sarima"
    version_policy: "latest"
    anomaly_threshold: 0.95
    window_size: 48

  - agent_id: "agent-1"
    metric: "http_latency_avg_ms"
    model_type: "sarima"
    version_policy: "latest"
    anomaly_threshold: 0.95
    window_size: 48
