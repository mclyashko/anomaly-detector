rules:
  - name: high_cpu
    metric: http.latency_avg_ms
    type: threshold
    condition: "value > 100"
    severity: warning

  - name: very_high_cpu
    metric: http.latency_avg_ms
    type: threshold
    condition: "value > 500"
    severity: critical

  - name: high_worker_load
    metric: worker.ops_total
    type: threshold
    condition: "value > 10000"
    severity: warning

  - name: error_rate_high
    metric: http.error_rate
    type: threshold
    condition: "value > 0.05"
    severity: critical

